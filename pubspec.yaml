name: awesome_bottom_sheet
description: >-
  Animated feedback bottom sheets for Flutter: success, error, warning and info
  messages with Lottie icons, theme-aware styling, typed results and dark mode.
version: 1.0.0
homepage: https://github.com/AHMED-HOMISHAN/awesome_bottom_sheet
repository: https://github.com/AHMED-HOMISHAN/awesome_bottom_sheet
issue_tracker: https://github.com/AHMED-HOMISHAN/awesome_bottom_sheet/issues
documentation: https://pub.dev/documentation/awesome_bottom_sheet/latest/

topics:
  - bottom-sheet
  - dialog
  - lottie
  - animation
  - ui

screenshots:
  - description: Success, error, text-field and custom-styled message sheets in light and dark mode.
    path: doc/screenshots/showcase.webp
  - description: A success message bottom sheet with an animated checkmark icon.
    path: doc/screenshots/success_light.webp
  - description: An error message bottom sheet in dark mode.
    path: doc/screenshots/error_dark.webp
  - description: A sheet with a text field that moves above the keyboard.
    path: doc/screenshots/content_light.webp
  - description: Custom accent color, background and corner radius.
    path: doc/screenshots/styled_light.webp

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  lottie: ^3.1.2
  material_ui: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
