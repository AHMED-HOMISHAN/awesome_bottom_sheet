# Publishes to pub.dev when a version tag is pushed, using pub.dev's
# automated publishing (no secrets needed). Enable it once on pub.dev:
# Admin -> Automated publishing -> GitHub Actions, with tag pattern v{{version}}.
name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      environment: pub.dev
